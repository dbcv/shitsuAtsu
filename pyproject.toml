[project]
name = "shitsuatsu"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    "pillow>=11.3.0",
    "einops>=0.8.2",
    "setuptools<81",
    "pycocotools>=2.0.11",
    "psutil<7",
    "sam3",
    "django>=4.2.30",
    "dj-svg>=0.3.1",
    "psycopg[binary]>=3.2.13",
    "django-environ>=0.13.0",
    "djangorestframework>=3.16.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "celery>=5.6.3",
    "redis>=7.0.1",
]

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
]

[tool.uv.sources]
sam3 = { path = "./sam3", editable = true }

[tool.taskipy.tasks]
dev = "uv run manage.py runserver 32803"
