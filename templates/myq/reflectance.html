{% extends "base.html" %}
{% load static %}
{% load static_tags %}
{% load svg %}

{% block unique_css %}
<link rel="stylesheet" href="{% static_ts 'css/reflectance.css' %}">
{% endblock %}


{% block unique_js %}

<script type="importmap">
{
    "imports": {
        "three": "{% static 'vendor/three@0.184.0/build/three.module.js' %}",
        "three/addons/": "{% static 'vendor/three@0.184.0/examples/jsm/' %}"
    }
}
</script>

<script>
    const objectuuid = '{{ object.uuid }}'
    const imageURL = "{{ object.get_image_url }}"
    const imageDescription = "{{ object.description }}"
    const api_save_segment_URL = "{% url 'api_save_segment' %}"

    const modelURL = "{% static 'models/model.glb' %}"
    const hdriURL = "{% static 'hdri/lilienstein_1k.hdr' %}"
    const roughness = "{{ object.original_photo.roughness }}"
    const metalness = "{{ object.original_photo.metalness }}"
    const albedo = "{{ object.original_photo.albedo }}"
    
</script>

<script type="module" src="{% static_ts 'js/reflectance.js' %}"></script>
<script src="{% static_ts 'js/color-picker.js' %}" defer></script>

{% endblock %}


{% block content %}

<div id="three-container"></div>
<div id="parameter-panel">
    <h2>Parameters</h2>
    <div class="parameter">
        <label for="roughness">Roughness:</label>
        <input type="range" id="roughness" name="roughness" min="0" max="1" step="0.01" value="{{ object.original_photo.roughness }}">
    </div>
    <div class="parameter">
        <label for="metalness">Metalness:</label>
        <input type="range" id="metalness" name="metalness" min="0" max="1" step="0.01" value="{{ object.original_photo.metalness }}">
    </div>
    <div class="parameter">
        <label for="albedo">Color:</label>
        <input type="color" id="albedo" name="albedo" value="{{ object.original_photo.albedo }}" hidden>
        <button id="preview" command="show-modal" commandfor="color-picker">Select Color</button>
    </div>
</div>
<dialog id="color-picker" closedby="any">
    <div id="circle"></div>
    <input type="range" id="L-slider" min="0" max="100" value="70">
</dialog>


{% endblock %}
