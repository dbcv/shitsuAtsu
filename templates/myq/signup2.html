{% extends "base.html" %}
{% load static_tags %}

{% block unique_css %}

{% endblock %}

{% block content %}
<div id="signup">
  <h2>サインアップ</h2>

    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">登録する</button>
  </form>
</div>
{% endblock %}
